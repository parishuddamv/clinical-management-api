spring:
  application:
    name: clinic-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    gateway:
      routes: []
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-minimum-64-chars-for-hs512-algorithm-security-requirement}
    expiration: ${JWT_EXPIRATION:86400000}
  google:
    clientId: ${GOOGLE_CLIENT_ID:}
    clientSecret: ${GOOGLE_CLIENT_SECRET:}
    redirectUrl: ${GOOGLE_REDIRECT_URL:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      max-age: 3600

# Service URLs - defaults to localhost for local development
# Override with environment variables for Docker deployment
service:
  patient:
    url: ${SERVICE_PATIENT_URL:http://localhost:8081}
  appointment:
    url: ${SERVICE_APPOINTMENT_URL:http://localhost:8082}
  followup:
    url: ${SERVICE_FOLLOWUP_URL:http://localhost:8083}
  notification:
    url: ${SERVICE_NOTIFICATION_URL:http://localhost:8084}
  billing:
    url: ${SERVICE_BILLING_URL:http://localhost:8085}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.clinicos: ${LOG_LEVEL_CLINICOS:INFO}
    org.springframework.cloud.gateway: WARN
    org.springframework.web: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/clinic-gateway.log}
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

