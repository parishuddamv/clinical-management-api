spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

server:
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    com.clinicos: INFO
    org.springframework: WARN
    org.springframework.security: INFO
  file:
    name: ${LOG_FILE_PATH:/var/log/clinicos/clinic-gateway.log}
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

