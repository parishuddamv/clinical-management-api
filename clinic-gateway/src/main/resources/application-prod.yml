spring:
  application:
    name: clinic-gateway


  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicos_db}
    username: ${DB_USERNAME:clinicos_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing ClinicOS Gateway schema"
    out-of-order: false
    table: flyway_schema_history_gateway

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

server:
  port: ${SERVER_PORT:8080}

  compression:
    enabled: true
    min-response-size: 1024

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-minimum-64-chars-for-hs512-algorithm-security-requirement}
    expiration: ${JWT_EXPIRATION:86400000}

  google:
    clientId: ${GOOGLE_CLIENT_ID:}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      max-age: 3600

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.clinicos: ${LOG_LEVEL_CLINICOS:INFO}
    org.springframework: WARN
    org.springframework.security: INFO
    org.springframework.cloud.gateway: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: ${LOG_FILE_PATH:/var/log/clinicos/clinic-gateway.log}
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    export:
      simple:
        enabled: true
