spring:
  application:
    name: clinic-emr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/clinicos_db}
    username: ${DB_USERNAME:clinicos_user}
    password: ${DB_PASSWORD:clinicos_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8086}
  compression:
    enabled: true
    min-response-size: 1024

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-minimum-64-chars-for-hs512-algorithm-security-requirement}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    local:
      base-path: ${FILE_STORAGE_PATH:./uploads}
    gcs:
      bucket-name: ${GCS_BUCKET_NAME:}
      project-id: ${GCS_PROJECT_ID:}
  services:
    notification-url: ${SERVICE_NOTIFICATION_URL:http://localhost:8084}

logging:
  level:
    root: ${LOG_LEVEL:WARN}
    com.clinicos: ${LOG_LEVEL_CLINICOS:DEBUG}
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:logs/clinic-emr.log}
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

