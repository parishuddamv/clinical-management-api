server:
  port: 8089

spring:
  application:
    name: clinic-subscription

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinicos_db}
    username: ${DB_USERNAME:clinicos_user}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: subscription_flyway_schema_history
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true
