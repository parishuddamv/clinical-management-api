spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 20000

server:
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    com.clinicos: INFO
    org.springframework: WARN
    org.springframework.security: INFO
  file:
    name: ${LOG_FILE_PATH:/var/log/clinicos/clinic-appointment.log}
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

