name: Build and Deploy ClinicOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  REGISTRY_HOSTNAME: asia-south1-docker.pkg.dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -U clean package -DskipTests

    - name: Run tests
      run: mvn test --batch-mode --quiet

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker for GCP
      run: |
        gcloud auth configure-docker ${{ env.REGISTRY_HOSTNAME }}

    - name: Build and push Docker images
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build clinic-patient
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-patient:${{ env.IMAGE_TAG }} ./clinic-patient
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-patient:${{ env.IMAGE_TAG }}
        
        # Build clinic-appointment
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-appointment:${{ env.IMAGE_TAG }} ./clinic-appointment
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-appointment:${{ env.IMAGE_TAG }}
        
        # Build clinic-followup
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-followup:${{ env.IMAGE_TAG }} ./clinic-followup
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-followup:${{ env.IMAGE_TAG }}
        
        # Build clinic-notification
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-notification:${{ env.IMAGE_TAG }} ./clinic-notification
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-notification:${{ env.IMAGE_TAG }}
        
        # Build clinic-billing
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-billing:${{ env.IMAGE_TAG }} ./clinic-billing
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-billing:${{ env.IMAGE_TAG }}
        
        # Build clinic-gateway
        docker build -t ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-gateway:${{ env.IMAGE_TAG }} ./clinic-gateway
        docker push ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}/clinic-gateway:${{ env.IMAGE_TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}

    - name: Deploy to Cloud Run
      env:
        IMAGE_TAG: ${{ github.sha }}
        REGISTRY_URL: ${{ env.REGISTRY_HOSTNAME }}/${{ env.PROJECT_ID }}
      run: |
        # Deploy clinic-patient
        gcloud run deploy clinic-patient \
          --image ${{ env.REGISTRY_URL }}/clinic-patient:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}
        
        # Deploy clinic-appointment
        gcloud run deploy clinic-appointment \
          --image ${{ env.REGISTRY_URL }}/clinic-appointment:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}
        
        # Deploy clinic-followup
        gcloud run deploy clinic-followup \
          --image ${{ env.REGISTRY_URL }}/clinic-followup:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}
        
        # Deploy clinic-notification
        gcloud run deploy clinic-notification \
          --image ${{ env.REGISTRY_URL }}/clinic-notification:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}
        
        # Deploy clinic-billing
        gcloud run deploy clinic-billing \
          --image ${{ env.REGISTRY_URL }}/clinic-billing:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}
        
        # Deploy clinic-gateway
        gcloud run deploy clinic-gateway \
          --image ${{ env.REGISTRY_URL }}/clinic-gateway:${{ env.IMAGE_TAG }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars DB_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}

