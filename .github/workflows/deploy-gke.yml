name: Deploy ClinicOS to GKE

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  PROJECT_ID: clinicos-prod-2026
  REGION: asia-south1
  CLUSTER_NAME: clinicos-cluster
  CLUSTER_ZONE: asia-south1-a
  NAMESPACE: clinicos
  REGISTRY: asia-south1-docker.pkg.dev/clinicos-prod-2026/clinicos-repo

jobs:

  # ============================================================
  # BUILD + TEST
  # ============================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all modules
        run: |
          mvn clean package -DskipTests

      - name: Run tests
        run: |
          mvn test


  # ============================================================
  # BUILD + PUSH DOCKER IMAGES
  # ============================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Maven artifacts
        run: |
          mvn clean package -DskipTests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # --------------------------------------------------------
      # Build images
      # --------------------------------------------------------

      - name: Build Docker images
        run: |

          docker build \
            -t $REGISTRY/clinic-patient:${GITHUB_SHA} \
            ./clinic-patient

          docker build \
            -t $REGISTRY/clinic-appointment:${GITHUB_SHA} \
            ./clinic-appointment

          docker build \
            -t $REGISTRY/clinic-followup:${GITHUB_SHA} \
            ./clinic-followup

          docker build \
            -t $REGISTRY/clinic-notification:${GITHUB_SHA} \
            ./clinic-notification

          docker build \
            -t $REGISTRY/clinic-billing:${GITHUB_SHA} \
            ./clinic-billing

          docker build \
            -t $REGISTRY/clinic-emr:${GITHUB_SHA} \
            ./clinic-emr

          docker build \
            -t $REGISTRY/clinic-staff:${GITHUB_SHA} \
            ./clinic-staff

          docker build \
            -t $REGISTRY/clinic-feedback:${GITHUB_SHA} \
            ./clinic-feedback

          docker build \
            -t $REGISTRY/clinic-gateway:${GITHUB_SHA} \
            ./clinic-gateway

      # --------------------------------------------------------
      # Push images
      # --------------------------------------------------------

      - name: Push Docker images
        run: |

          docker push $REGISTRY/clinic-patient:${GITHUB_SHA}

          docker push $REGISTRY/clinic-appointment:${GITHUB_SHA}

          docker push $REGISTRY/clinic-followup:${GITHUB_SHA}

          docker push $REGISTRY/clinic-notification:${GITHUB_SHA}

          docker push $REGISTRY/clinic-billing:${GITHUB_SHA}

          docker push $REGISTRY/clinic-emr:${GITHUB_SHA}

          docker push $REGISTRY/clinic-staff:${GITHUB_SHA}

          docker push $REGISTRY/clinic-feedback:${GITHUB_SHA}

          docker push $REGISTRY/clinic-gateway:${GITHUB_SHA}


  # ============================================================
  # DEPLOY TO GKE
  # ============================================================
  deploy:
    name: Deploy to GKE Production
    runs-on: ubuntu-latest
    needs: docker

    permissions:
      contents: read

    steps:

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            $CLUSTER_NAME \
            --zone $CLUSTER_ZONE \
            --project $PROJECT_ID

      # ========================================================
      # Update deployments
      # ========================================================

      - name: Deploy clinic-patient
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-patient \
            clinic-patient=$REGISTRY/clinic-patient:${GITHUB_SHA}

      - name: Deploy clinic-appointment
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-appointment \
            clinic-appointment=$REGISTRY/clinic-appointment:${GITHUB_SHA}

      - name: Deploy clinic-followup
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-followup \
            clinic-followup=$REGISTRY/clinic-followup:${GITHUB_SHA}

      - name: Deploy clinic-notification
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-notification \
            clinic-notification=$REGISTRY/clinic-notification:${GITHUB_SHA}

      - name: Deploy clinic-billing
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-billing \
            clinic-billing=$REGISTRY/clinic-billing:${GITHUB_SHA}

      - name: Deploy clinic-emr
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-emr \
            clinic-emr=$REGISTRY/clinic-emr:${GITHUB_SHA}

      - name: Deploy clinic-staff
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-staff \
            clinic-staff=$REGISTRY/clinic-staff:${GITHUB_SHA}

      - name: Deploy clinic-feedback
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-feedback \
            clinic-feedback=$REGISTRY/clinic-feedback:${GITHUB_SHA}

      - name: Deploy clinic-gateway
        run: |
          kubectl -n $NAMESPACE set image deployment/clinic-gateway \
            clinic-gateway=$REGISTRY/clinic-gateway:${GITHUB_SHA}

      # ========================================================
      # Wait for rollout
      # ========================================================

      - name: Wait for deployments
        run: |

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-patient \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-appointment \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-followup \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-notification \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-billing \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-emr \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-staff \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-feedback \
            --timeout=5m

          kubectl -n $NAMESPACE rollout status \
            deployment/clinic-gateway \
            --timeout=5m

      # ========================================================
      # Production verification
      # ========================================================

      - name: Show production status
        run: |

          echo "======================================"
          echo "ClinicOS Production Deployment"
          echo "======================================"

          kubectl -n $NAMESPACE get deployments -o wide

          echo ""
          echo "======================================"
          echo "Pods"
          echo "======================================"

          kubectl -n $NAMESPACE get pods -o wide

          echo ""
          echo "======================================"
          echo "Images"
          echo "======================================"

          kubectl -n $NAMESPACE get deployments \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image