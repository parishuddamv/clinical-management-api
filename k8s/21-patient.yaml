# ============================================================
# ClinicOS Patient Service
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-patient
  namespace: clinicos
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  selector:
    matchLabels:
      app: clinic-patient

  template:
    metadata:
      labels:
        app: clinic-patient

    spec:
      containers:
        - name: clinic-patient
          image: asia-south1-docker.pkg.dev/clinicos-prod-2026/clinicos-repo/clinic-patient:1.0.4

          ports:
            - containerPort: 8081
              protocol: TCP

          env:
            - name: SERVER_PORT
              value: "8081"

          envFrom:
            - configMapRef:
                name: clinicos-config
            - secretRef:
                name: clinicos-secrets

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
              scheme: HTTP
            failureThreshold: 40
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

---

apiVersion: v1
kind: Service
metadata:
  name: clinic-patient
  namespace: clinicos

spec:
  selector:
    app: clinic-patient

  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP

  type: ClusterIP