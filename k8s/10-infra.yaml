# ============================================================
# ClinicOS Infrastructure
#
# Redis:
#   Runs inside GKE to keep initial costs low.
#
# PostgreSQL:
#   Managed by Google Cloud SQL.
#
# Kafka:
#   Disabled for now.
#
# Cloud SQL:
#   Accessed through Cloud SQL Auth Proxy using
#   GKE Workload Identity.
# ============================================================


# ============================================================
# Redis Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: clinicos
spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      containers:
        - name: redis
          image: redis:7-alpine

          args:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "512mb"
            - "--maxmemory-policy"
            - "allkeys-lru"

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---

# ============================================================
# Redis Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: clinicos
spec:
  selector:
    app: redis

  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

  type: ClusterIP

---

# ============================================================
# Cloud SQL Auth Proxy Deployment
#
# Google Cloud SQL:
#   Project : clinicos-prod-2026
#   Region  : asia-south1
#   Instance: clinicos-db
#
# Workload Identity:
#   Kubernetes SA:
#     clinicos-cloudsql
#
#   Google SA:
#     clinicos-cloudsql@clinicos-prod-2026.iam.gserviceaccount.com
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  namespace: clinicos
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cloud-sql-proxy

  template:
    metadata:
      labels:
        app: cloud-sql-proxy

    spec:
      serviceAccountName: clinicos-cloudsql

      containers:
        - name: cloud-sql-proxy

          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.3

          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            - "clinicos-prod-2026:asia-south1:clinicos-db"

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---

# ============================================================
# Cloud SQL Proxy Service
#
# Application services connect to:
#
# cloud-sql-proxy.clinicos.svc.cluster.local:5432
#
# ConfigMap:
#   DB_URL:
#   jdbc:postgresql://cloud-sql-proxy.clinicos.svc.cluster.local:5432/clinicos_db
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: cloud-sql-proxy
  namespace: clinicos
spec:
  selector:
    app: cloud-sql-proxy

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP

  type: ClusterIP