# Shared non-secret configuration for all ClinicOS services
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicos-config
  namespace: clinicos
data:
  SPRING_PROFILES_ACTIVE: "prod"
  # Point at your managed PostgreSQL (Cloud SQL / RDS) in production.
  DB_URL: "jdbc:postgresql://postgres.clinicos.svc.cluster.local:5432/clinicos_db"
  DB_USERNAME: "clinicos_user"
  DB_POOL_SIZE: "15"
  DB_MIN_IDLE: "5"
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis.clinicos.svc.cluster.local"
  REDIS_PORT: "6379"
  CACHE_TYPE: "redis"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.clinicos.svc.cluster.local:9092"
  KAFKA_TOPIC_NOTIFICATIONS: "clinicos.notifications"
  CORS_ALLOWED_ORIGINS: "https://app.clinicos.example.com"
  LOG_LEVEL: "WARN"
  LOG_LEVEL_CLINICOS: "INFO"
  JWT_EXPIRATION: "86400000"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  # Internal service discovery URLs (used by the gateway)
  SERVICE_PATIENT_URL: "http://clinic-patient.clinicos.svc.cluster.local:8081"
  SERVICE_APPOINTMENT_URL: "http://clinic-appointment.clinicos.svc.cluster.local:8082"
  SERVICE_FOLLOWUP_URL: "http://clinic-followup.clinicos.svc.cluster.local:8083"
  SERVICE_NOTIFICATION_URL: "http://clinic-notification.clinicos.svc.cluster.local:8084"
  SERVICE_BILLING_URL: "http://clinic-billing.clinicos.svc.cluster.local:8085"
  SERVICE_EMR_URL: "http://clinic-emr.clinicos.svc.cluster.local:8086"
  SERVICE_STAFF_URL: "http://clinic-staff.clinicos.svc.cluster.local:8087"
  SERVICE_FEEDBACK_URL: "http://clinic-feedback.clinicos.svc.cluster.local:8088"

