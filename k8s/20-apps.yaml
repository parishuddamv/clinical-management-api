apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic-emr
  namespace: clinicos
spec:
  replicas: 2
  selector:
    matchLabels: { app: clinic-emr }
  template:
    metadata:
      labels: { app: clinic-emr }
    spec:
      containers:
        - name: clinic-emr
          image: REGISTRY/clinic-emr:latest
          ports: [{ containerPort: 8086 }]
          env:
            - { name: SERVER_PORT, value: "8086" }
          envFrom:
            - configMapRef: { name: clinicos-config }
            - secretRef: { name: clinicos-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8086 }
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: emr-uploads }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emr-uploads
  namespace: clinicos
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: clinic-emr
  namespace: clinicos
spec:
  selector: { app: clinic-emr }
  ports: [{ port: 8086, targetPort: 8086 }]
