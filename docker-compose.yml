version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: clinicos-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-clinicos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      POSTGRES_DB: ${DB_NAME:-clinicos_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - clinicos-db-data:/var/lib/postgresql/data
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinicos_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Clinic Patient Service
  clinic-patient:
    build:
      context: ./clinic-patient
      dockerfile: Dockerfile
    container_name: clinic-patient-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinicos_db}
      DB_USERNAME: ${DB_USERNAME:-clinicos_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Clinic Appointment Service
  clinic-appointment:
    build:
      context: ./clinic-appointment
      dockerfile: Dockerfile
    container_name: clinic-appointment-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinicos_db}
      DB_USERNAME: ${DB_USERNAME:-clinicos_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Clinic Follow-up Service
  clinic-followup:
    build:
      context: ./clinic-followup
      dockerfile: Dockerfile
    container_name: clinic-followup-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinicos_db}
      DB_USERNAME: ${DB_USERNAME:-clinicos_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Clinic Notification Service
  clinic-notification:
    build:
      context: ./clinic-notification
      dockerfile: Dockerfile
    container_name: clinic-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinicos_db}
      DB_USERNAME: ${DB_USERNAME:-clinicos_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SERVER_PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Clinic Billing Service
  clinic-billing:
    build:
      context: ./clinic-billing
      dockerfile: Dockerfile
    container_name: clinic-billing-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-clinicos_db}
      DB_USERNAME: ${DB_USERNAME:-clinicos_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinicos_password}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      SERVER_PORT: 8085
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Clinic API Gateway
  clinic-gateway:
    build:
      context: ./clinic-gateway
      dockerfile: Dockerfile
    container_name: clinic-gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-32-chars-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_LEVEL_CLINICOS: ${LOG_LEVEL_CLINICOS:-DEBUG}
    ports:
      - "8080:8080"
    depends_on:
      - clinic-patient
      - clinic-appointment
      - clinic-followup
      - clinic-notification
      - clinic-billing
    networks:
      - clinicos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  clinicos-db-data:
    driver: local

networks:
  clinicos-network:
    driver: bridge
