[project]
name = "gift-platform-mvp"
version = "0.1.0"
description = "Pre-funded one-time cash-gift platform MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn==0.30.6",
  "sqlalchemy==2.0.35",
  "pydantic==2.9.2",
  "python-multipart==0.0.9",
  "qrcode[pil]==7.4.2"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "httpx==0.27.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

